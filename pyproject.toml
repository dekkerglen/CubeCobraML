[project]
name = "ccml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.23.5",
    "tensorflow[and-cuda]>=2.13; sys_platform == 'linux'",
    "tensorflow>=2.13; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-metal; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# These entrypoints must set CUDA/TF env vars before `import tensorflow`
# (and hide the Metal GPU before any op is created), so module-level imports
# legitimately follow runtime setup — E402 is expected here, not a smell.
"ccml/train.py" = ["E402"]
"scripts/*.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.11.11",
    "pytest>=8.0",
]
